name: Release

# Publishing needs the NPM_TOKEN secret and a `release` environment configured
# in the repository settings. `id-token: write` is for npm provenance, so only
# the publish job, which runs no dependency code, gets it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts
        env:
          TARBALL: ${{ needs.check.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
