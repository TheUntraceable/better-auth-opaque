name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test dist under Node ESM
        run: |
          node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.opaque !== 'function' || typeof m.opaqueClient !== 'function') throw new Error('index.js exports');"
          node --input-type=module -e "const m = await import('./dist/server.js'); if (typeof m.opaque !== 'function') throw new Error('server.js exports');"
          node --input-type=module -e "const m = await import('./dist/client.js'); if (typeof m.opaqueClient !== 'function') throw new Error('client.js exports');"
